<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <div class="matrix-info-section">
      <img src="./eisenhower-matrix.jpg">
      <a class="more-info-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main-content">
      <p id="task-add-section">
        <label class="task-input-label" for="task-input">Add Item</label>
        <div class="task-form">
          <input id="task-input" class="task-item form-input text-input" type="text">
          <button class="btn">Add</button>
        </div>
      </p>
      <h3 class="section-title">Todo</h3>
      <ul id="incomplete-tasks">
        <li class="task-list-item">
          <input class="form-input checkbox-input" type="checkbox">
          <label class="task-item task-item-label">Pay Bills</label>
          <input type="text" class="task-item form-input text-input">
          <button class="btn btn-edit">Edit</button>
          <button class="btn btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="task-list-item edit-mode">
          <input class="form-input checkbox-input" type="checkbox">
          <label class="task-item task-item-label">Go Shopping</label>
          <input type="text" value="go shopping" class="task-item form-input text-input">
          <button class="btn btn-edit">Save</button>
          <button class="btn btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="section-title">Completed</h3>
      <ul id="completed-tasks">
        <li class="task-list-item">
          <input class="form-input checkbox-input" type="checkbox" checked>
          <label class="task-item task-item-label">See the Doctor</label>
          <input type="text" class="task-item form-input text-input">
          <button class="btn btn-edit">Edit</button>
          <button class="btn btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
