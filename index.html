<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <section class="info-matrix">
      <img class="info-matrix__image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix illustration">
      <a class="info-matrix__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </section>
    <main class="main-content">
      <section class="task-add" id="task-add">
        <label class="task-add__label" for="task-input">Add Item</label>
        <form class="task-add__form">
          <input class="task-add__input form-input text-input" id="task-input" type="text">
          <button class="btn button--add" type="button">Add</button>
        </form>
      </section>
      <section class="todo">
        <h3 class="todo__title section-title">Todo</h3>
        <ul class="todo__list" id="incomplete-tasks">
          <li class="todo__item">
            <input class="todo__checkbox form-input checkbox-input" type="checkbox">
            <label class="todo__label task-item-label">Pay Bills</label>
            <input class="todo__edit-input form-input text-input" type="text">
            <button class="btn button--edit">Edit</button>
            <button class="btn button--delete">
              <img src="./remove.svg" alt="Delete task button">
            </button>
          </li>
          <li class="todo__item todo__item--edit-mode">
            <input class="todo__checkbox form-input checkbox-input" type="checkbox">
            <label class="todo__label task-item-label">Go Shopping</label>
            <input class="todo__edit-input form-input text-input" type="text" value="go shopping">
            <button class="btn button--edit">Save</button>
            <button class="btn button--delete">
              <img src="./remove.svg" alt="Delete task button">
            </button>
          </li>
        </ul>
      </section>
      <section class="completed">
        <h3 class="completed__title section-title">Completed</h3>
        <ul class="completed__list" id="completed-tasks">
          <li class="completed__item">
            <input class="completed__checkbox form-input checkbox-input" type="checkbox" checked>
            <label class="completed__label task-item-label">See the Doctor</label>
            <input class="completed__edit-input form-input text-input" type="text">
            <button class="btn button--edit">Edit</button>
            <button class="btn button--delete">
              <img src="./remove.svg" alt="Delete task button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
